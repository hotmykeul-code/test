name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run Unit & Widget Tests
        working-directory: ./mobile
        run: flutter test

      - name: Build Android APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Prepare Named APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/socialclone-ai-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: socialclone-ai-release-apk
          path: mobile/build/app/outputs/flutter-apk/socialclone-ai-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('SocialClone AI Mobile {0}', github.ref_name) || 'SocialClone AI Mobile - Latest Build' }}
          draft: false
          prerelease: false
          files: mobile/build/app/outputs/flutter-apk/socialclone-ai-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

